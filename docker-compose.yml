# =============================================================================
# Trading Orchestra — Infrastruktur
#
# Dienste:
#   PostgreSQL    → persistente Tabellen (Postgres)
#   ClickHouse    → Zeitreihen & Event-Speicher (ClickHouse)
#   Redis         → Caching & Message-Queue (Redis)
#   MinIO         → Objektspeicher für Rohdaten & Features (S3-kompatibel)
#   Redpanda      → Event-Bus ( Kafka-kompatibel)
#   MLflow        → Experiment- & Modellverwaltung
#   Prometheus    → Metriken
#   Grafana       → Dashboards
# =============================================================================

services:
  # ─── Postgres ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: trading
      POSTGRES_USER: orchestra
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestra -d trading"]
      interval: 10s
      timeout: 5s
      retries: 5
    secrets:
      - postgres_password

  # ─── ClickHouse ───────────────────────────────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: trading_events
      CLICKHOUSE_USER: orchestra
      CLICKHOUSE_PASSWORD_FILE: /run/secrets/clickhouse_password
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ch_data:/var/lib/clickhouse
      - ./infrastructure/clickhouse/config.xml:/etc/clickhouse-server/config.d/logging.xml:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    secrets:
      - clickhouse_password

  # ─── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MinIO ────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: orchestra
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    secrets:
      - minio_password

  # ─── Redpanda ─────────────────────────────────────────────────────────────
  redpanda:
    image: docker.redpanda.com/vectorized/redpanda:v24.3.6
    restart: unless-stopped
    command:
      - redpanda start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --smp 1
      - --memory 1G
      - --default-num-shards 2
      - --enable-sasl
    ports:
      - "9092:9092"
      - "8082:8082"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─── MLflow ───────────────────────────────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.0
    restart: unless-stopped
    command: mlflow server --backend-store-uri sqlite:///mlflow.db --default-artifact-root /artifacts --host 0.0.0.0
    ports:
      - "5000:5000"
    volumes:
      - mlflow_artifacts:/artifacts
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000

  # ─── Prometheus ───────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.0
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"

  # ─── Grafana ──────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD_FILE: /run/secrets/grafana_password
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      prometheus:
        condition: service_healthy
    secrets:
      - grafana_password

# ─── Volumes ────────────────────────────────────────────────────────────────
volumes:
  pg_data:
  ch_data:
  redis_data:
  minio_data:
  mlflow_artifacts:
  prometheus_data:
  grafana_data:

# ─── Secrets ────────────────────────────────────────────────────────────────
# In Produktion via Docker Secrets oder Vault.
# Hier Platzhalter; lokale Entwicklung nutzt Umgebungsvariablen.
secrets:
  postgres_password:
    file: ./configs/secrets/postgres_password.txt
  clickhouse_password:
    file: ./configs/secrets/clickhouse_password.txt
  minio_password:
    file: ./configs/secrets/minio_password.txt
  grafana_password:
    file: ./configs/secrets/grafana_password.txt