# =============================================================================
# Trading Orchestra — Infrastruktur
#
# Dienste:
#   PostgreSQL    → persistente Tabellen (Postgres)
#   ClickHouse    → Zeitreihen & Event-Speicher (ClickHouse)
#   Redis         → Caching & Message-Queue (Redis)
#   MinIO         → Objektspeicher für Rohdaten & Features (S3-kompatibel)
#   Redpanda      → Event-Bus ( Kafka-kompatibel)
#   MLflow        → Experiment- & Modellverwaltung
#   Prometheus    → Metriken
#   Grafana       → Dashboards
# =============================================================================

services:
  # ─── Postgres ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: trading
      POSTGRES_USER: orchestra
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestra -d trading"]
      interval: 10s
      timeout: 5s
      retries: 5
    secrets:
      - postgres_password
    networks:
      - backend

  # ─── ClickHouse ───────────────────────────────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: trading_events
      CLICKHOUSE_USER: orchestra
      CLICKHOUSE_PASSWORD_FILE: /run/secrets/clickhouse_password
    volumes:
      - ch_data:/var/lib/clickhouse
      - ./infrastructure/clickhouse/config.xml:/etc/clickhouse-server/config.d/logging.xml:ro
      - ./infrastructure/clickhouse/config.d/ipv4.xml:/etc/clickhouse-server/config.d/ipv4.xml:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    secrets:
      - clickhouse_password
    networks:
      - backend

  # ─── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # ─── MinIO ────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: orchestra
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_password
    ports:
      # 9000 ist auf dem Host belegt (anderer Container) → 19000
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    secrets:
      - minio_password
    networks:
      - backend

  # ─── Redpanda ─────────────────────────────────────────────────────────────
  redpanda:
    image: docker.io/redpandadata/redpanda:v24.3.6
    restart: unless-stopped
    command:
      - redpanda start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --overprovisioned
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # ─── MLflow ───────────────────────────────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.0
    restart: unless-stopped
    command: mlflow server --backend-store-uri sqlite:///mlflow.db --default-artifact-root /artifacts --host 0.0.0.0
    volumes:
      - mlflow_artifacts:/artifacts
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "127.0.0.1:5000:5000"
    networks:
      - backend

  # ─── Prometheus ───────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.0
    restart: unless-stopped
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # ─── API ────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      API_SECRET_KEY_FILE: /run/secrets/api_secret_key
      API_CORS_ORIGINS: "http://localhost:3000,http://localhost:8080,http://localhost"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: trading
      DB_USER: orchestra
      CH_HOST: clickhouse
      CH_PORT: "8123"
      CH_DB: trading_events
      REDPANDA_SERVERS: redpanda:9092
    ports:
      - "8080:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    secrets:
      - api_secret_key
      - postgres_password
      - clickhouse_password
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - backend

  # ─── Grafana ──────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD_FILE: /run/secrets/grafana_password
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      prometheus:
        condition: service_healthy
    secrets:
      - grafana_password
    networks:
      - backend

  # ─── db-init (One-Shot Bootstrap) ─────────────────────────────────────────
  db-init:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "apps.db_init"]
    restart: "no"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: trading
      DB_USER: orchestra
      CH_HOST: clickhouse
      CH_PORT: "8123"
      CH_DB: trading_events
      REDPANDA_SERVERS: redpanda:9092
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    secrets:
      - postgres_password
      - clickhouse_password
    networks:
      - backend

  # ─── News-Ingestion (RSS → PostgreSQL) ─────────────────────────────────────
  news-ingestion:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "apps.news_ingestion"]
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: trading
      DB_USER: orchestra
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/heartbeat && [ $(( $(date +%s) - $(stat -c %Y /tmp/heartbeat) )) -lt 120 ]"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - backend

  # ─── Market-Producer (Dummy-Adapter → Redpanda) ────────────────────────────
  market-producer:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "apps.market_producer"]
    restart: unless-stopped
    environment:
      REDPANDA_SERVERS: redpanda:9092
      MARKET_DATA_TOPIC: market_data
    depends_on:
      redpanda:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/heartbeat && [ $(( $(date +%s) - $(stat -c %Y /tmp/heartbeat) )) -lt 180 ]"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - backend

  # ─── Ingestion-Consumer (Redpanda → ClickHouse) ────────────────────────────
  ingestion-consumer:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "apps.ingestion"]
    restart: unless-stopped
    environment:
      CH_HOST: clickhouse
      CH_PORT: "8123"
      CH_DB: trading_events
      REDPANDA_SERVERS: redpanda:9092
      MARKET_DATA_TOPIC: market_data
    depends_on:
      clickhouse:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    secrets:
      - clickhouse_password
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/heartbeat && [ $(( $(date +%s) - $(stat -c %Y /tmp/heartbeat) )) -lt 120 ]"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - backend

  # ─── Orchestrator (Shadow-Pipeline → PostgreSQL) ───────────────────────────
  # Führt die OrchestratorPipeline zyklisch im Shadow-Modus aus (Analyse,
  # Konsens, Audit — nie Order-Ausführung) und persistiert in shadow_decisions.
  orchestrator:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "apps.orchestrator_service"]
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: trading
      DB_USER: orchestra
      CH_HOST: clickhouse
      CH_PORT: "8123"
      CH_DB: trading_events
      ORCHESTRATOR_INTERVAL_SECONDS: "900"
      ORCHESTRATOR_INSTRUMENTS: "BTC/USDT,ETH/USDT"
    depends_on:
      db-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    secrets:
      - postgres_password
      - clickhouse_password
    healthcheck:
      test:
        - CMD-SHELL
        - |
          python -c 'import os,pathlib,sys,time;p=pathlib.Path("/tmp/orchestrator_heartbeat");m=3*float(os.environ.get("ORCHESTRATOR_INTERVAL_SECONDS","900"));sys.exit(0 if p.exists() and time.time()-p.stat().st_mtime<m else 1)'
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 300s
    networks:
      - backend

  # ─── Alertmanager ──────────────────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./infrastructure/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

# ─── Networks ───────────────────────────────────────────────────────────────
networks:
  backend:
    driver: bridge

# ─── Volumes ────────────────────────────────────────────────────────────────
volumes:
  pg_data:
  ch_data:
  redis_data:
  minio_data:
  mlflow_artifacts:
  prometheus_data:
  grafana_data:

# ─── Secrets ────────────────────────────────────────────────────────────────
# In Produktion via Docker Secrets oder Vault.
# Hier Platzhalter; lokale Entwicklung nutzt Umgebungsvariablen.
secrets:
  postgres_password:
    file: ./configs/secrets/postgres_password.txt
  clickhouse_password:
    file: ./configs/secrets/clickhouse_password.txt
  minio_password:
    file: ./configs/secrets/minio_password.txt
  grafana_password:
    file: ./configs/secrets/grafana_password.txt
  api_secret_key:
    file: ./configs/secrets/api_secret_key.txt