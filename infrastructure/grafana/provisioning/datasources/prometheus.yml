apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  # Nur-Lese-User "grafana" (siehe infrastructure/clickhouse/users.d/grafana_ro.xml)
  - name: ClickHouse
    type: grafana-clickhouse-datasource
    access: proxy
    editable: false
    jsonData:
      host: clickhouse
      # 9000 = natives TCP-Protokoll (Plugin-Default "Native")
      port: 9000
      username: grafana
      defaultDatabase: trading_events
    secureJsonData:
      password: orchestra-ro