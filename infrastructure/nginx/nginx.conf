worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10m;

    # Security headers (always applied)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # GZip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rate limiting zone (belt-and-suspenders, app-level is primary)
    limit_req_zone $binary_remote_addr zone=global:10m rate=30r/s;

    # ---- HTTP → HTTPS redirect (port 80) ----
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Let's Encrypt ACME challenge allow-list
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        # Everything else → permanent redirect to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---- HTTPS server (port 443) ----
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name _;

        # ------------------------------------------------------------------
        # SSL/TLS configuration — production-grade
        # Certs managed by certbot: /etc/letsencrypt/live/<DOMAIN>/
        # Fallback to self-signed for local dev when certbot not present.
        # ------------------------------------------------------------------
        ssl_certificate      /etc/nginx/ssl/live/trading-orchestra.internal/fullchain.pem;
        ssl_certificate_key  /etc/nginx/ssl/live/trading-orchestra.internal/privkey.pem;

        # Modern TLS settings (TLS 1.3 only)
        ssl_protocols TLSv1.3;
        ssl_ciphers 'TLS13-CHACHA20-POLY1305-SHA256:TLS13-AES-256-GCM-SHA384:TLS13-AES-128-GCM-SHA256';
        ssl_prefer_server_ciphers off;

        # Security
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # HSTS (1 year, include subdomains)
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        # OCSP Stapling (enabled when real certs are used)
        # ssl_stapling on;
        # ssl_stapling_verify on;

        # ---- API (port 8000 backend) ----
        location /api/ {
            limit_req zone=global burst=20 nodelay;

            proxy_pass http://api:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # Prometheus (read-only metrics — no auth needed)
        location /metrics/ {
            proxy_pass http://prometheus:9090/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Grafana (read-only dashboards)
        location /grafana/ {
            proxy_pass http://grafana:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check — always accessible (no redirect)
        location /health {
            proxy_pass http://api:8000/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Default: 404
        location / {
            return 404 '{"error": "not found"}';
            default_type application/json;
        }
    }
}